<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Ball Base Leather Gradient -->
    <linearGradient id="ballBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Cyan Trim Gradient -->
    <linearGradient id="cyanTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Dark Navy Trim Gradient -->
    <linearGradient id="navyTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter for Transparent Background -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Pimple Grip Pattern -->
    <pattern id="gripPattern" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="3" cy="3" r="1" fill="#475569" opacity="0.15"/>
      <circle cx="9" cy="9" r="1" fill="#475569" opacity="0.15"/>
    </pattern>

    <!-- Clip Path for Ball Shape -->
    <clipPath id="ballClip">
      <path d="M 80 250 C 130 110, 370 110, 420 250 C 370 390, 130 390, 80 250 Z"/>
    </clipPath>
  </defs>

  <!-- Main Ball Group (No Rect Background) -->
  <g filter="url(#dropShadow)">
    
    <!-- Base Ellipse Shape -->
    <path id="ball-base" d="M 80 250 C 130 110, 370 110, 420 250 C 370 390, 130 390, 80 250 Z" fill="url(#ballBody)"/>

    <!-- Applied Surface Texture -->
    <path d="M 80 250 C 130 110, 370 110, 420 250 C 370 390, 130 390, 80 250 Z" fill="url(#gripPattern)"/>

    <!-- Trim Graphics (Clipped to Ball Shape) -->
    <g clip-path="url(#ballClip)">
      <!-- Top Navy Curve -->
      <path d="M 60 250 C 130 80, 370 80, 440 250 C 370 140, 130 140, 60 250 Z" fill="url(#navyTrim)"/>
      
      <!-- Top Cyan Accent Curve -->
      <path d="M 70 250 C 130 120, 370 120, 430 250 C 370 150, 130 150, 70 250 Z" fill="url(#cyanTrim)"/>

      <!-- Bottom Navy Curve -->
      <path d="M 60 250 C 130 420, 370 420, 440 250 C 370 360, 130 360, 60 250 Z" fill="url(#navyTrim)"/>

      <!-- Bottom Cyan Accent Curve -->
      <path d="M 70 250 C 130 380, 370 380, 430 250 C 370 350, 130 350, 70 250 Z" fill="url(#cyanTrim)"/>

      <!-- Center Seam Lines -->
      <path d="M 80 250 Q 250 248 420 250" stroke="#64748b" stroke-width="2.5" fill="none" opacity="0.6"/>
      <path d="M 250 128 C 240 180, 240 320, 250 372" stroke="#64748b" stroke-width="1.5" fill="none" opacity="0.4"/>
    </g>

    <!-- Valve Air Hole -->
    <circle cx="310" cy="210" r="3" fill="#334155"/>
    <circle cx="310" cy="210" r="1.5" fill="#0f172a"/>

    <!-- Laces / Stitching Group -->
    <g id="laces">
      <!-- Main Stitched Seam Under Laces -->
      <path d="M 170 250 Q 250 248 330 250" stroke="#475569" stroke-width="3" fill="none"/>
      
      <!-- Central Longitudinal White Lace Bar -->
      <path d="M 180 250 L 320 250" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none"/>

      <!-- Vertical Cross Laces -->
      <line x1="195" y1="241" x2="195" y2="259" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <line x1="217" y1="240" x2="217" y2="260" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <line x1="239" y1="240" x2="239" y2="260" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <line x1="261" y1="240" x2="261" y2="260" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <line x1="283" y1="240" x2="283" y2="260" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <line x1="305" y1="241" x2="305" y2="259" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

      <!-- Lace Highlights -->
      <line x1="180" y1="249" x2="320" y2="249" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Glossy Surface Highlight Overlay -->
    <path d="M 110 230 C 150 140, 350 140, 390 230 C 320 170, 180 170, 110 230 Z" fill="#ffffff" opacity="0.25"/>
  </g>
</svg>
